      - run: yarn install --frozen-lockfile
      - run: yarn build
      - shell: bash
        run: |
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          npm init -y
          npm install @guidepup/guidepup
          npm install -g "${GITHUB_WORKSPACE}"
          export PATH="$(npm bin -g):$PATH"

          cat > node_modules/@guidepup/guidepup/manifest.json <<'EOF'
          {
