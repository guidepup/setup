name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-setup:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
            # macos-15,
            # macos-15-intel,
            # macos-26,
            # macos-26-intel,
            xcode-27,
            # windows-2022,
            # windows-2025,
            # windows-11-arm,
            # ubuntu-26.04,
            # ubuntu-26.04-arm,
          ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-test-${{ matrix.os }}
          path: |
            **/recordings/**/*

  test-setup-ignore-tcc-db:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn ci:ignore-tcc-db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-test-ignore-tcc-db-${{ matrix.os }}
          path: |
            **/recordings/**/*

  test-setup-unsupported:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - name: Setup should fail
        run: |
          set +e

          yarn ci
          exit_code=$?

          if [ "$exit_code" -eq 0 ]; then
            echo "Expected setup to fail, but it succeeded."

            exit 1
          fi

          echo "Setup correctly failed with exit code $exit_code."

  test-install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
            # macos-15,
            # macos-15-intel,
            # macos-26,
            # macos-26-intel,
            xcode-27,
            # windows-2022,
            # windows-2025,
            # windows-11-arm,
            # ubuntu-26.04,
            # ubuntu-26.04-arm,
          ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - shell: bash
        run: |
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          npm init -y
          npm install @guidepup/guidepup
          npm install -g "${GITHUB_WORKSPACE}"
          export PATH="$(npm bin -g):$PATH"

          cat > node_modules/@guidepup/guidepup/manifest.json <<'EOF'
          {
            "version": 1,
            "screenReaders": [
              {
                "id": "orca",
                "name": "Orca",
                "platforms": ["linux"],
                "defaultDownload": true,
                "assets": [
                  {
                    "version": "0.2.0-50.2",
                    "platformVersion": "7",
                    "repository": "guidepup/orca",
                    "asset": "guidepup-orca-0.2.0-50.2.tar.gz",
                    "sha256": "9ce2b7962e6e3e5245782e1c2d628feeb2637484d32139dffe841fd585e07b71"
                  }
