name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          [
            macos-14,
            macos-15,
            macos-15-intel,
            macos-26,
            macos-26-intel,
            windows-2022,
            windows-2025,
            windows-11-arm,
          ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-test-${{ matrix.os }}
          path: |
            **/recordings/**/*
  test-ignore-tcc-db:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn ci:ignore-tcc-db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-test-ignore-tcc-db-${{ matrix.os }}
          path: |
            **/recordings/**/*

  install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-15, macos-15-intel, macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: |
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          npm init -y
          npm install @guidepup/guidepup
          npm install -g "${GITHUB_WORKSPACE}"
          export PATH="$(npm bin -g):$PATH"

          cat > node_modules/@guidepup/guidepup/manifest.json <<'EOF'
          {
            "version": 1,
            "screenReaders": [
              {
                "id": "voiceover",
                "name": "VoiceOver",
                "platforms": ["darwin"],
                "defaultDownload": true,
                "assets": [
                  {
                    "version": "1.0.0",
                    "platformVersion": "26",
                    "repository": "guidepup/voiceover",
                    "release": "v1.0.0",
                    "asset": "voiceover-macos-26.dmg",
                    "sha256": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
                  }
                ]
              }
            ]
          }
          EOF

          guidepup install
